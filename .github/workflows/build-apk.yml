name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip project
        run: |
          # newest zip = the one with the most recent commit
          ZIP=$(for f in *.zip; do [ -f "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then echo "No zip file found in repo root"; exit 1; fi
          echo "Available zips:"; ls -la *.zip
          echo "Using: $ZIP"
          mkdir -p app
          unzip -q -o "$ZIP" -d app
          PKG=$(find app -name package.json -not -path "*/node_modules/*" -not -path "*/__MACOSX/*" | head -n 1)
          if [ -z "$PKG" ]; then echo "package.json not found in zip"; exit 1; fi
          DIR=$(dirname "$PKG")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Verify this is the latest zip
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -q 'id="cr"' www/index.html || { echo "ERROR: creator button missing -> an OLD zip was used"; exit 1; }
          test -d resources/android/res || { echo "ERROR: icon resources missing -> an OLD zip was used"; exit 1; }
          test -f resources/icon-v2.txt || { echo "ERROR: new icon marker missing -> an OLD zip was used (zip name: $PROJECT_DIR)"; exit 1; }
          sha1sum resources/android/res/mipmap-xxxhdpi/ic_launcher_foreground.png www/logo.png
          echo "OK: latest zip detected"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Apply app icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          RES=android/app/src/main/res
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          rm -f $RES/mipmap-*/ic_launcher*.png $RES/mipmap-anydpi-v26/ic_launcher*.xml
          if [ ! -d resources/android/res ]; then echo 'ERROR: resources/android/res missing in this zip (old zip?)'; exit 1; fi
          cp -r resources/android/res/. $RES/
          ls -la $RES/mipmap-xxxhdpi
          sha1sum $RES/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -n 'icon' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Setup fixed signing key
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}${{ secrets.KEYSTORE_B64_1 }}${{ secrets.KEYSTORE_B64_2 }}${{ secrets.KEYSTORE_B64_3 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "ERROR: KEYSTORE_PASSWORD secret is not set"; exit 1; fi
          if [ -f "$GITHUB_WORKSPACE/darooyar.keystore" ]; then
            echo "Using darooyar.keystore from repo root"
            cp "$GITHUB_WORKSPACE/darooyar.keystore" app/darooyar.keystore
          else
            CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \n\r\t"')
            echo "KEYSTORE_B64 length: ${#CLEAN} (expected 3516)"
            printf '%s' "$CLEAN" | base64 -d > app/darooyar.keystore || { echo "ERROR: KEYSTORE secret is corrupted"; exit 1; }
          fi
          keytool -list -keystore app/darooyar.keystore -storepass "$KS_PASS" -alias darooyar | tail -2
          cat >> app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file('darooyar.keystore')
                      storePassword '$KS_PASS'
                      keyAlias 'darooyar'
                      keyPassword '$KS_PASS'
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: darooyar-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
